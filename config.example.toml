# QQ Bot 配置示例文件
# 复制为 config.toml 并按需修改。
# 优先级：TOML < 环境变量 < CLI 参数
# 注意：superusers 等顶层字段必须放在所有 [section] 之前

# ---------------------------------------------------------------------------
# 超级用户（管理员工具授权）—— 必须放在所有 [section] 之前
# ---------------------------------------------------------------------------
# superusers = ["123456789", "987654321"]
superusers = []

# 私聊白名单，只接受这些用户的私聊。空数组 = 不限制
# allowed_private_users = [10001, 10002]
allowed_private_users = []

# ---------------------------------------------------------------------------
# LLM 接入
# ---------------------------------------------------------------------------
[llm]
# Anthropic 兼容 API 地址
# 环境变量: LLM_BASE_URL | CLI: --llm-base-url
base_url = "http://127.0.0.1:34567/v1"

# API 密钥
# 环境变量: LLM_API_KEY | CLI: --llm-api-key
api_key = "sk-placeholder"

# 模型名称
# 环境变量: LLM_MODEL | CLI: --llm-model
model = "claude-sonnet-4-6"

# 单次回复最大 token 数
max_tokens = 1024

# ---------------------------------------------------------------------------
# 上下文窗口与压缩
# ---------------------------------------------------------------------------
[llm.context]
# 上下文窗口大小（token 数），超出后触发 compact
max_context_tokens = 1_000_000

# compact 后保留比例（0.0–1.0）
compact_ratio = 0.7

# ---------------------------------------------------------------------------
# 提示缓存预热
# ---------------------------------------------------------------------------
[llm.cache]
# 是否启用缓存预热
warm_enabled = true

# 每隔多少条消息触发一次预热
warm_interval_messages = 10

# 预热缓存 TTL（秒）
warm_ttl_seconds = 300

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
[log]
dir = "storage/logs"

# ---------------------------------------------------------------------------
# 长期记忆
# ---------------------------------------------------------------------------
[memory]
# 记忆文件存储目录
dir = "storage/memories"

# ---------------------------------------------------------------------------
# 人设与指令（soul 目录）
# ---------------------------------------------------------------------------
[soul]
# 存放 identities.md 和 instruction.md 的目录
dir = "soul"

# ---------------------------------------------------------------------------
# 群聊
# ---------------------------------------------------------------------------
[group]
# 内存中保留的最大群消息条数
max_timeline_messages = 200

# 启动时从 NapCat 拉取的历史消息条数
history_load_count = 30

# 群聊白名单，只处理这些群的消息。空数组 = 不限制
# allowed_groups = [100001, 100002]
allowed_groups = []

# ---------------------------------------------------------------------------
# NapCat HTTP API
# ---------------------------------------------------------------------------
[napcat]
# NapCat HTTP API 地址
# 环境变量: NAPCAT_API_URL
api_url = "http://localhost:29300"

# ---------------------------------------------------------------------------
# 主动插话
# ---------------------------------------------------------------------------
[proactive]
# 是否启用主动插话
enabled = true

# 决策使用的模型
model = "claude-haiku-4-5-20251001"

# 决策调用超时（秒）
timeout = 15.0

# 传给决策模型的最近消息条数
context_lines = 20

# 主动插话后冷却时间（秒）
cooldown = 60

# 消息间隙多久触发一次评估（秒）
batch_timeout = 5.0

# 最多攒多少条消息强制触发评估
batch_size = 10

