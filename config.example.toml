# QQ Bot 配置示例文件
# 复制为 config.toml 并按需修改。
# 优先级：TOML < 环境变量 < CLI 参数

# 私聊白名单，只接受这些用户的私聊。空数组 = 不限制
# allowed_private_users = [10001, 10002]
allowed_private_users = []

# ---------------------------------------------------------------------------
# 管理员（QQ号 → 昵称）
# 注入系统提示词（记忆中视为可信来源）+ 授权群管理工具（禁言、头衔等）
# ---------------------------------------------------------------------------
[admins]
# "123456789" = "管理员昵称"

# ---------------------------------------------------------------------------
# LLM 接入
# ---------------------------------------------------------------------------
[llm]
# Anthropic 兼容 API 地址
# 环境变量: LLM_BASE_URL | CLI: --llm-base-url
base_url = "http://127.0.0.1:34567/v1"

# API 密钥
# 环境变量: LLM_API_KEY | CLI: --llm-api-key
api_key = "sk-placeholder"

# 模型名称
# 环境变量: LLM_MODEL | CLI: --llm-model
model = "claude-sonnet-4-6"

# 单次回复最大 token 数
max_tokens = 1024

# ---------------------------------------------------------------------------
# 上下文窗口
# ---------------------------------------------------------------------------
[llm.context]
# 上下文窗口大小（token 数），超出后触发 compact
max_context_tokens = 1_000_000

# ---------------------------------------------------------------------------
# LLM 用量追踪
# ---------------------------------------------------------------------------
[llm.usage]
# 是否启用用量记录
enabled = true
# 单次调用耗时告警阈值（秒）
slow_threshold_s = 60.0

# ---------------------------------------------------------------------------
# 搜索增强（OpenAI Responses API 原生 web_search）
# ---------------------------------------------------------------------------
# 开启后，查询会同时发送给 OpenAI 和本地 DDGS 多引擎，再合并排序。
# Codex/ChatGPT 订阅不能代替 API key；不开启时仍使用 Bing/Google/Brave/DDG。
[search]
# 环境变量: SEARCH_OPENAI_ENABLED
openai_enabled = false
# 环境变量: SEARCH_OPENAI_BASE_URL
openai_base_url = "https://api.openai.com/v1"
# 环境变量: SEARCH_OPENAI_API_KEY
openai_api_key = ""
# 环境变量: SEARCH_OPENAI_MODEL
openai_model = "gpt-5-mini"

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
[log]
dir = "storage/logs"

# ---------------------------------------------------------------------------
# 长期记忆（备忘录系统）
# ---------------------------------------------------------------------------
[memo]
# 记忆文件存储目录
dir = "storage/memories"
# 单条用户备忘录最大字符数
user_max_chars = 300
# 单条群备忘录最大字符数
group_max_chars = 500
# 备忘录索引最大行数
index_max_lines = 200
# 是否启用备忘录历史记录
history_enabled = true

# ---------------------------------------------------------------------------
# 人设与指令（soul 目录）
# ---------------------------------------------------------------------------
[soul]
# 存放 identities.md 和 instruction.md 的目录
dir = "soul"

# ---------------------------------------------------------------------------
# 上下文压缩
# ---------------------------------------------------------------------------
[compact]
# compact 触发比例（input_tokens 占 max_context_tokens 的比例）
ratio = 0.7
# 每次压缩前多少比例的消息（0.5 = 前 50%）
compress_ratio = 0.5
# 连续压缩失败上限，超过后跳过
max_failures = 3
# cache_hit 低于此百分比时告警（窗口内平均值）
cache_hit_warn = 90.0
# 计算平均 cache hit rate 的时间窗口（分钟）
cache_alert_window_m = 30.0
# 两次 cache 告警间最短间隔（分钟）
cache_alert_cooldown_m = 10.0

# ---------------------------------------------------------------------------
# Dream 整理（离线摘要）
# ---------------------------------------------------------------------------
[dream]
# 是否启用 dream 整理
enabled = false
# 多久跑一次（小时）
interval_hours = 24
# 单次 dream 最大轮次
max_rounds = 15

# ---------------------------------------------------------------------------
# 实时热点与网络梗
# ---------------------------------------------------------------------------
[meme]
# 开启后会定时获取各平台热榜，并给模型提供 search_meme / get_hot_trends 工具
enabled = true
# UAPI 兼容热榜接口；也可以替换成自托管聚合服务的兼容地址
hotboard_url = "https://uapis.cn/api/v1/misc/hotboard"
platforms = ["weibo", "bilibili", "douyin", "xiaohongshu", "zhihu", "baidu"]
# 6 个平台每 15 分钟各请求一次，避免给免费接口造成压力
refresh_minutes = 15
per_platform_limit = 30
storage_file = "storage/memes.json"
# 已核验梗义、出处、用法和向量的 SQLite 知识库
knowledge_file = "storage/meme_knowledge.db"
# 过期热点不再注入提示词
active_hours = 72
max_entries = 500
max_prompt_entries = 12

# ---------------------------------------------------------------------------
# 群聊
# ---------------------------------------------------------------------------
[group]
# 启动时从 NapCat 拉取的历史消息条数
history_load_count = 30

# 群聊白名单，只处理这些群的消息。空数组 = 不限制
# allowed_groups = [100001, 100002]
allowed_groups = []

# 非@消息的 debounce 等待时间（秒），等消息间隙后触发模型调用
debounce_seconds = 5.0

# 最多攒多少条消息强制触发模型调用
batch_size = 10

# 主动插话成功后至少沉默多少秒；@、回复 bot、表情包接话不受此限制
proactive_cooldown_seconds = 60.0

# 每个群每小时最多主动插话次数；0 = 不限制
proactive_max_replies_per_hour = 12

# 仅@模式：开启后只在被@时回复，不主动插话
at_only = false

# 启动加载历史后是否立即让模型判断并可能补一句；默认关闭，避免重启后突然插话
startup_catchup = false

# 全局屏蔽用户列表（所有群生效）
blocked_users = []

# ---------------------------------------------------------------------------
# 群聊单群覆盖（可选）
# 未填的参数自动使用上方全局值，blocked_users 取并集
# ---------------------------------------------------------------------------
# [group.overrides.100001]
# blocked_users = [123456, 789012]
# at_only = true
# debounce_seconds = 10.0
# batch_size = 20
# history_load_count = 50
# proactive_cooldown_seconds = 120.0
# proactive_max_replies_per_hour = 6

# ---------------------------------------------------------------------------
# NapCat HTTP API
# ---------------------------------------------------------------------------
[napcat]
# NapCat HTTP API 地址
# 环境变量: NAPCAT_API_URL
api_url = "http://localhost:29300"

# ---------------------------------------------------------------------------
# 宿主控制服务（管理指令：启停 GPT-SoVITS API / bot 容器）
# ---------------------------------------------------------------------------
[control]
# 总开关
enabled = false
# bot 容器访问宿主控制服务的地址
base_url = "http://host.docker.internal:8765"
# 控制服务监听端口（与 scripts/control_server.py 一致）
port = 8765
# 鉴权 token，必须与宿主上 scripts/control_server.py 使用的 config.toml 相同
token = ""
timeout_seconds = 120.0

# ---------------------------------------------------------------------------
# 网易云音乐
# ---------------------------------------------------------------------------
[music]
# 需要单独运行一个 NeteaseCloudMusicApi 兼容服务；机器人不会接收或保存明文密码
enabled = true
api_base_url = "http://127.0.0.1:3000"
# 管理员私聊扫码后的 cookie 存储位置（已在 .gitignore 中忽略）
cookie_file = "storage/netease_cookie.json"
timeout_seconds = 15.0
# 可选：由 Bot 自动启动本机 API，仅允许绑定 loopback
auto_start = false
service_app = ""
node_executable = "node"

# ---------------------------------------------------------------------------
# 语音合成（TTS）
# ---------------------------------------------------------------------------
[tts]
# 总开关
enabled = false
# provider = "edge" | "gpt_sovits"
provider = "edge"
# Edge TTS 音色/语速/音量/代理（仅 provider=edge 生效）
voice = "zh-CN-XiaoxiaoNeural"
rate = "+0%"
volume = "+0%"
proxy = ""
# GPT-SoVITS API 地址与参考音频
base_url = "http://127.0.0.1:9880"
ref_audio_path = ""
prompt_text = ""
prompt_lang = "zh"
text_lang = "zh"
text_split_method = "cut5"
media_type = "wav"
timeout_seconds = 120.0
max_chars = 300

# ---------------------------------------------------------------------------
# 图片生成（OpenAI 兼容 images/generations 接口：GPT-image-2 等）
# ---------------------------------------------------------------------------
[imagegen]
# 总开关
enabled = false
# OpenAI 兼容接口地址（米醋中转 New API）
base_url = "https://www.micuapi.ai/v1"
# API key：填米醋 Image2 分组的 token（sk- 开头）；
# 只有 base_url 指向智谱（bigmodel.cn）时才可留空并回退 [vision].api_key
api_key = ""
# 模型：gpt-image-2（1K 档福利价，~30s）；2K/4K 会自动切 gpt-image-2-pro
model = "gpt-image-2"
# 尺寸：W/H 需为 8 的倍数，≤2.25MP 走 1K 福利档；如 1024x1024 / 1536x1024 / 2048x2048
size = "1280x1280"
timeout_seconds = 120.0
max_prompt_chars = 500
# 合并用户后续修改的轻量聊天模型；留空则复用 [llm].model
prompt_rewrite_model = ""
# 米醋中转国内直连，无需代理；若换官方 OpenAI 才需要填（与 [tts].proxy 同格式）
proxy = ""
# 限额（0 = 不限制），用 /设置 修改后立即生效
daily_global_limit = 20
daily_user_limit = 5
daily_group_limit = 15
cooldown_seconds = 15.0
usage_file = "storage/imagegen_usage.json"

# ---------------------------------------------------------------------------
# 多模态视觉（图片理解）
# ---------------------------------------------------------------------------
[vision]
# 总开关，关闭后所有图片降级为 [图片] 文字
enabled = true

# 单条消息最多处理的图片数，超出的用 [图片] 代替
max_images_per_message = 5

# 图片缩放最大边像素
max_dimension = 768

# 图片缓存目录
cache_dir = "storage/image_cache"

# 缓存过期时间（小时）
cache_max_age_hours = 24

# 免费识图预处理（OpenAI 兼容端点，智谱 GLM-4.6V-Flash 完全免费）
# 聊天模型不支持图片时，先用它把图转成文字描述，再交给聊天模型理解
# 环境变量: VISION_BASE_URL / VISION_API_KEY / VISION_MODEL
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key = ""
model = "glm-4.6v-flash"
# 识图策略：only_at = 仅被 @ 触发回复时识图；always = 所有回复都识图
describe_mode = "only_at"

# ---------------------------------------------------------------------------
# 表情包系统
# ---------------------------------------------------------------------------
[sticker]
# 总开关
enabled = true
# 收到群成员发送图片表情时立即让 bot 接话（默认关闭）
reply_on_receive = false
# 模型决定发送表情包后，实际发送的概率（0.0-1.0）
send_probability = 0.8
# 表情包存储目录
storage_dir = "storage/stickers"
# 最大表情包数量（Dream 整理时执行）
max_count = 200
